name: Daily Shopify Inventory Sync

on:
  schedule:
    - cron: '30 2 * * *'  # 8:00 AM IST (UTC+5:30) = 02:30 UTC
  workflow_dispatch:       # allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install gspread google-auth

      - name: Write Google service account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Run Shopify sync
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          TOKEN_API_KEY: ${{ secrets.TOKEN_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: node shopify_orders.js

      - name: Run projected demand calculations
        env:
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
        run: python projected_demand.py
